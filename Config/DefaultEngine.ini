bRemoteExecution=True

[/Script/Engine.RendererSettings]
r.MobileHDR=False

; --- 2D pixel-art rendering ---
; ---------------------------------------------------------------------------
; 2D PIXEL-ART RENDERING
; UE4's modern defaults are designed for 3D and actively harm pixel art.
; ---------------------------------------------------------------------------

; Anti-aliasing: 0 = None, 1 = FXAA, 2 = TemporalAA (UE4 default), 3 = MSAA.
; TemporalAA blends multiple frames to smooth edges - on pixel art that smears
; adjacent texels together and makes everything look blurry. THIS IS THE SINGLE
; BIGGEST CAUSE of blurry pixel art in UE4. Set to None.
r.DefaultFeature.AntiAliasing=0

; Auto-exposure (eye adaptation): Paper2D sprites are unlit, but they still pass
; through tonemapping. In a level with no lights or sky the scene is mostly
; black, so auto-exposure cranks up and blows out the sprites.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Bias=0

; Effects that soften or dirty the image.
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.Bloom=False

; NOTE ON VIGNETTE: there is no r.DefaultFeature.Vignette cvar in 4.27 - adding
; one here does nothing. The vignette (which darkens screen edges and made the
; floor look shaded) is applied by the tonemapper and must be disabled with an
; unbound PostProcessVolume in the level, with override_vignette_intensity=True.
; See Docs/Structure.md section 10.

